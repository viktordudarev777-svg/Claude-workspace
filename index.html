function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const end = new Date(dateStr + 'T00:00:00');
  return Math.round((end - todayMidnight()) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const [y, m, d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}

function generateId() {
  return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function getRowClass(endDate) {
  const days = daysUntil(endDate);
  if (days === null) return '';
  if (days < 0) return 'row-expired';
  if (days <= 30) return 'row-expiring-soon';
  return '';
}

function remindersHtml(list) {
  const buckets = { d7: [], d14: [], d30: [] };
  list.forEach(c => {
    const days = daysUntil(c.endDate);
    if (days === null || days < 0) return;
    if (days <= 7) buckets.d7.push(c);
    else if (days <= 14) buckets.d14.push(c);
    else if (days <= 30) buckets.d30.push(c);
  });
  const hasAny = buckets.d7.length || buckets.d14.length || buckets.d30.length;
  if (!hasAny) return { hasAny: false, html: '' };

  function group(title, cls, l) {
    if (!l.length) return '';
    l.sort((a, b) => (a.endDate < b.endDate ? -1 : 1));
    const chips = l.map(c =>
      `<span class="reminder-chip ${cls}">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)} — ${escapeHtml(c.company)} (до ${formatDate(c.endDate)})</span>`
    ).join('');
    return `<div class="reminder-group"><div class="reminder-title ${cls}">${title} (${l.length})</div><div class="reminder-list">${chips}</div></div>`;
  }
  const html = group('Истекает в ближайшие 7 дней', 'd7', buckets.d7) +
    group('Истекает в ближайшие 14 дней', 'd14', buckets.d14) +
    group('Истекает в ближайшие 30 дней', 'd30', buckets.d30);
  return { hasAny: true, html };
}

function rowHtml(client) {
  const rowClass = getRowClass(client.endDate);
  return `<tr${rowClass ? ` class="${rowClass}"` : ''}>
    <td data-label="Имя">${escapeHtml(client.firstName)}</td>
    <td data-label="Фамилия">${escapeHtml(client.lastName)}</td>
    <td data-label="Телефон">${escapeHtml(client.phone)}</td>
    <td data-label="Email">${escapeHtml(client.email)}</td>
    <td data-label="Страховая">${escapeHtml(client.company)}</td>
    <td class="num" data-label="Номер полиса">${escapeHtml(client.policyNumber)}</td>
    <td class="num" data-label="Начало">${formatDate(client.startDate)}</td>
    <td class="num" data-label="Окончание">${formatDate(client.endDate)}</td>
    <td data-label="Статус"><span class="status-badge status-${escapeHtml(client.status)}">${escapeHtml(client.status)}</span></td>
    <td class="notes-cell" data-label="Заметки" title="${escapeHtml(client.notes)}">${escapeHtml(client.notes)}</td>

      <button type="button" class="btn-danger" data-action="delete" data-id="${client.id}">Удалить</button>
    </td>
  </tr>`;
}

function filterSortClients(list, query, statusVal, sortDir) {
  const q = (query || '').trim().toLowerCase();
  let filtered = list.filter(c => {
    const matchesQuery = !q || [c.firstName, c.lastName, c.policyNumber, c.company]
      .some(f => (f || '').toLowerCase().includes(q));
    const matchesStatus = !statusVal || c.status === statusVal;
    return matchesQuery && matchesStatus;
  });
  filtered.sort((a, b) => {
    const aD = a.endDate || '', bD = b.endDate || '';
    if (aD === bD) return 0;
    const cmp = aD < bD ? -1 : 1;
    return sortDir === 'asc' ? cmp : -cmp;
  });
  return filtered;
}

  countBadge.textContent = `Показано: ${filtered.length} из ${clients.length}`;
}

function renderAll() {
  renderReminders();
  renderTable();
}

function resetForm() {
  formEl.reset();
  clientIdInput.value = '';
  editingId = null;
  statusInput.value = 'активен';
  submitBtn.textContent = 'Добавить клиента';
  formTitle.textContent = 'Добавить клиента';
  cancelEditBtn.style.display = 'none';
  formNote.textContent = '';
  formNote.classList.remove('is-error');
}

function startEdit(id) {
  const client = clients.find(c => c.id === id);
  if (!client) return;
  editingId = id;
  clientIdInput.value = id;
  firstNameInput.value = client.firstName;
  lastNameInput.value = client.lastName;
  phoneInput.value = client.phone;
  emailInput.value = client.email;
  companyInput.value = client.company;
  policyNumberInput.value = client.policyNumber;
  startDateInput.value = client.startDate;
  endDateInput.value = client.endDate;
  statusInput.value = client.status;
  notesInput.value = client.notes;
  submitBtn.textContent = 'Сохранить изменения';
  formTitle.textContent = 'Редактировать клиента';
  cancelEditBtn.style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const LS_KEY = 'insuranceClientsCache';

async function saveClients(newClients, opts) {
  opts = opts || {};
  clients = newClients;
  renderAll();

  if (isSyncAvailable && artifactApi) {
    isSaving = true;
    setSyncStatus('saving');
    if (submitBtn) submitBtn.disabled = true;
    try {
      await artifactApi.publish(buildFullDocument(clients));
      // On success the view reloads automatically with the confirmed state.
    } catch (err) {
      const code = err && err.code;
      if (code === 'conflict') {
        // Routine: another device published first, this view is already reloading.
        return;
      }
      isSaving = false;
      if (submitBtn) submitBtn.disabled = false;
      try { localStorage.setItem(LS_KEY, JSON.stringify(clients)); } catch (e) {}
      const message = code === 'not_writer' || code === 'not_granted'
        ? 'нет прав на изменение (только просмотр)'
        : (err && err.message) || 'ошибка сети';
      setSyncStatus('error', message);
      if (opts.formError) opts.formError(message);
    }
  } else {
    try { localStorage.setItem(LS_KEY, JSON.stringify(clients)); } catch (e) {}
    setSyncStatus('local');
  }
}

function attachListeners() {
  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    if (isSaving) return;
    const client = {
      id: editingId || generateId(),
      firstName: firstNameInput.value.trim(),
      lastName: lastNameInput.value.trim(),
      phone: phoneInput.value.trim(),
      email: emailInput.value.trim(),
      company: companyInput.value.trim(),
      policyNumber: policyNumberInput.value.trim(),
      startDate: startDateInput.value,
      endDate: endDateInput.value,
      status: statusInput.value,
      notes: notesInput.value.trim(),
    };
    let next;
    if (editingId) {
      next = clients.map(c => (c.id === editingId ? client : c));
    } else {
      next = clients.concat([client]);
    }
    const wasEditing = !!editingId;
    saveClients(next, {
      formError: (msg) => {
        formNote.textContent = 'Изменения сохранены только локально (' + msg + ').';
        formNote.classList.add('is-error');
      }
    });
    if (!wasEditing) resetForm();
    else resetForm();
  });

  cancelEditBtn.addEventListener('click', resetForm);

  tableBody.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    if (btn.getAttribute('data-action') === 'edit') {
      startEdit(id);
    } else if (btn.getAttribute('data-action') === 'delete') {
      const client = clients.find(c => c.id === id);
      const name = client ? `${client.firstName} ${client.lastName}` : 'этого клиента';
      if (!confirm(`Удалить клиента "${name}"? Это действие нельзя отменить.`)) return;
      const next = clients.filter(c => c.id !== id);
      if (editingId === id) resetForm();
      saveClients(next);
    }
  });

  sortByEndDateHeader.addEventListener('click', function () {
    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    sortByEndDateHeader.textContent = 'Окончание ' + (sortDirection === 'asc' ? '▾' : '▴');
    renderTable();
  });

  searchInput.addEventListener('input', renderTable);
  statusFilter.addEventListener('change', renderTable);
}

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

async function init() {
  document.getElementById('app').innerHTML = pageBodyHtml(clients);
  bindRefs();
  attachListeners();
  renderAll();
  setSyncStatus('checking');

  if (window.claude && typeof window.claude.use === 'function') {
    try {
      artifactApi = await window.claude.use('artifact');
    } catch (e) {
      artifactApi = null;
    }
  }
  isSyncAvailable = !!artifactApi;

  if (isSyncAvailable) {
    setSyncStatus('synced');
  } else {
    const cached = loadLocalCache();
    if (cached && Array.isArray(cached)) {
      clients = cached;
      renderAll();
    }
    setSyncStatus('local');
  }
}

init();
</script>
</body>
</html>
